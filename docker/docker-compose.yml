services:
  api:
    container_name: api
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      - db
    volumes:
      - ..:/app
    ports:
      - "8000:8000"

  db:
    image: mysql:latest
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: "pw123!"
      MYSQL_DATABASE: mydb
      MYSQL_USER: user
      MYSQL_PASSWORD: "pw123!"
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"

volumes:
  mysql-data:
